name: 更新情報並部署

on:
  schedule:
    # 台北時間 00:00 / 05:00 / 10:00 / 15:00 / 20:00（UTC+8，沒有日光節約）
    # 換算成 UTC：16:00（前一日）/ 21:00（前一日）/ 02:00 / 07:00 / 12:00
    - cron: '0 2,7,12,16,21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'README.md']

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # 一律取最新的 main，避免 Re-run 時用到舊版程式
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 單元測試
        run: npm test
      # 資料不再提交進 repo：上一輪的狀態直接從已部署的網站取回
      - name: 取得上一輪資料
        run: node scripts/fetch-prev.mjs
        env:
          PREV_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/latest.json
      - name: 抓取各來源
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 整理要發布的檔案
        run: |
          mkdir _site
          cp -r index.html assets data feeds feed.xml _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
      # 放在部署之後：來源異常時網站照常更新，但讓這次執行轉紅，GitHub 會寄失敗通知信
      - name: 檢查來源健康
        run: node scripts/check-health.mjs
