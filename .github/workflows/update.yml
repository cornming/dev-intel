name: 更新情報並部署

on:
  schedule:
    # 每小時檢查一次（第 23 分：避開整點壅塞，GitHub 在整點附近常延遲或略過排程）。
    # 是否真的更新由「守門」決定：台北 00／05／10／15／20 點的預定時段，或資料超過 5.5 小時沒更新（補跑）。
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    # 只改文件、測試、AI 規則時不重新部署網站（測試由 ci.yml 負責）
    paths-ignore: ['data/**', 'README.md', '*.md', 'docs/**', 'test/**', 'ai/**', '.github/workflows/ci.yml']

permissions:
  contents: read

jobs:
  gate:
    name: 守門（要不要更新）
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/gate.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: g
        run: node scripts/gate.mjs
        env:
          EVENT_NAME: ${{ github.event_name }}
          LATEST_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/latest.json

  update:
    name: 抓取、分析並部署
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    # 同一時間只部署一個；排隊中的只保留最新一個（它會取最新的 main，所以不會漏掉任何變更）
    concurrency:
      group: update-and-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # 一律取最新的 main，避免 Re-run 時用到舊版程式
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 單元測試
        run: npm test
      # 資料不再提交進 repo：上一輪的狀態直接從已部署的網站取回
      - name: 取得上一輪資料
        run: node scripts/fetch-prev.mjs
        env:
          PREV_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/latest.json
          PREV_HISTORY_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/history.json
      - name: 抓取各來源
        id: build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 整理要發布的檔案
        run: |
          mkdir _site
          cp -r index.html assets data feeds feed.xml _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # 部署偶爾會因平台暫時性問題失敗（實測：上傳後立刻回報「找不到 artifact」，約 1 秒就失敗）。
      # 資料不進 git，這一輪若白跑就得等下一輪，所以失敗時等一下再試一次。
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: 部署失敗，等 30 秒後重試
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
      # 放在部署之後：來源異常時網站照常更新，但讓這次執行轉紅，GitHub 會寄失敗通知信。
      # 用 !cancelled() 而不是預設的「前面都成功」：就算部署失敗，只要這一輪有抓到資料，來源異常仍要通知。
      - name: 檢查來源健康
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: node scripts/check-health.mjs
